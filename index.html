<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Generator</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sec1">
        <div class="sec1-1">
            <h1>Portfolio Generator</h1>
        </div>
        <div class="sec1-2">
            <select id="theme-select" class="theme-select">
                <option value="Red">Red 🔴</option>
                <option value="Black">Black ⚫</option>
                <option value="Purple">Purple 🟣</option>
            </select>
            <button id="create-new" class="create-new">Create New</button>
            <button id="export-html" class="export-html">Export HTML</button>
            <h2 id="username" class="username">Your Name</h2>
        </div>
    </header>
    <div class="app-container">
        <section class="build-sec">
            <h2>Your Portfolio:</h2>
            <form id="build-form">
                <div class="form-group">
                    <label for="name-input">Full Name</label>
                    <input type="text" id="name-input" placeholder="Philopater Hany Malak Saad etc...">
                </div>
                <div class="form-group">
                    <label for="input-role">Your Role / Title</label>
                    <input type="text" id="input-role" placeholder="Machine Learning Engineer etc...">
                </div>
                <div class="form-group">
                    <label for="input-bio">Bio</label>
                    <textarea id="input-bio" rows="4" placeholder="Enter your Bio etc..."></textarea>
                </div>
                <div class="form-group">
                    <label for="input-skills">Your Skills</label>
                    <input type="text" id="input-skills" placeholder="HTML, CSS, Javascript etc...">
                </div>
                <div class="form-group">
                    <label for="input-github"></label>
                    <input type="text" id="input-github" placeholder="https://github.com/philopater123321">
                </div>
            </form>
        </section>
        
        <section class="preview-sec">
            <h2>Live Preview</h2>
            <div id="portfolio-preview" class="card-container">
                <div class="card-header">
                    <h1>Your Name</h1>
                    <h3>Your Role / Title</h3>
                </div>

                <div class="card-body">
                    <p id="preview-bio">Your Bio will appear on hear</p>

                    <div class="skill-section">
                        <h4>Skills</h4>
                        <ul id="preview-skills">
                            <li>Skill 1</li>
                            <li>Skill 2</li>
                            <li>Skill 3</li>
                        </ul>
                    </div>
                    <div class="social-section">
                        <a id="preview-github" href="#" target="_blank" class="btn">Github Profile</a>
                    </div>
                </div>
            </div>
            
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
